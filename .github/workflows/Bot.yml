name: LuckyJelen Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node server.js
        env:
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
